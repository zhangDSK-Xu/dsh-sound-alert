# ============================================================================
# dsh-sound-alert —— DSH bundle patch（挂载声明）
# ============================================================================
# 这是「按包名安装」时使用的 bundle 层：DSH 启动时叠加各 bundle 的 patch，
# 把本插件插入 profile 的配置树。
#
# 安装（把本目录作为本地包链进 profile）：
#   dsh plugin --profile <profile> add link:<本目录绝对路径>
#
# 若目标 profile 由 Electron 应用独占（例如 desktop），CLI 不允许操作，
# 可改用「绝对路径 insert」写法，见 README.md「安装」一节。
# ============================================================================

- insert:
    - id: dsh-sound-alert
      name: dsh-sound-alert
